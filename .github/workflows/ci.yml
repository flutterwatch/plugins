# CI for every package in packages/.
#
# Scoped to `lib` and `test` on purpose. Each `example/` is a separate Flutter
# project with its own pubspec — several are ported upstream examples carrying
# their own sub-projects (audioplayers' `example/server/`), and AUTHORING.md
# says to ship those verbatim. Gating on them would make CI red for reasons
# that are not the package's, and would pressure people into editing code the
# repo deliberately keeps unmodified.
#
# Native code is not compiled here: these are watchOS FFI plugins, and every
# test fakes the bindings through a `forTesting` constructor, so nothing needs
# a Mac. Compiling the `.m` sources needs a watchOS SDK and belongs in the
# per-package `example` build, run on a Mac by hand — see AUTHORING.md §3.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The Flutter release flutter-watchos pins (bin/internal/flutter.version
          # in the CLI repo), so the packages are checked against the SDK their
          # users build with. It moves with the CLI's flutter.version.
          flutter-version: 3.47.5
          cache: true

      - run: flutter --version

      # One job looping rather than a matrix leg per package: each leg would
      # re-install Flutter to run a few seconds of tests. The loop keeps going
      # after a failure and reports every package, so one broken package does
      # not hide the state of the others.
      - name: Analyze and test every package
        run: |
          failed=()
          for dir in packages/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            ok=1
            (cd "$dir" && flutter pub get)               || ok=0
            (cd "$dir" && flutter analyze lib test)      || ok=0
            (cd "$dir" && flutter test)                  || ok=0
            echo "::endgroup::"
            if [ "$ok" -eq 1 ]; then
              echo "PASS $name"
            else
              echo "::error title=$name::analyze or tests failed"
              failed+=("$name")
            fi
          done

          echo
          echo "### Package results" >> "$GITHUB_STEP_SUMMARY"
          if [ ${#failed[@]} -eq 0 ]; then
            total=$(ls -d packages/*/ | wc -l | tr -d ' ')
            echo "All $total packages passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Failed: ${failed[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "FAILED: ${failed[*]}"
            exit 1
          fi

      # Spec 0006 criterion 3: nothing the steps above run may write a file
      # that git does not ignore, or the next publish would ship it.
      - name: The package steps leave the tree clean
        if: success() || failure()
        run: tool/check_clean_tree.sh

  # Checks of the repository as a whole, by the scripts in tool/. Each step
  # runs even when an earlier one failed, so one run reports every problem.
  checks:
    name: repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check compares each package with the commit it was
          # last published from, so it needs the history.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Fetch the tool dependencies
        working-directory: tool
        run: dart pub get

      # The scripts are test infrastructure; their own tests run their
      # fixtures, each of which must fail or pass as its `expect` file says.
      - name: Analyze and test the tool
        if: success() || failure()
        working-directory: tool
        run: |
          dart analyze --fatal-infos
          dart test

      # Spec 0006 Decision 2d and 0007 D8: no forbidden word in any file,
      # outside tool/words/forbidden_words_allow.txt and tool/words/pending.txt.
      - name: Word check
        if: success() || failure()
        run: tool/check_words.sh

      # Spec 0006 criterion 3: what `flutter-watchos test` writes into a
      # package is ignored, so it never dirties the tree or ships.
      - name: Generated files are ignored
        if: success() || failure()
        run: tool/check_generated_ignored.sh

      # Spec 0006 criterion 4: a package whose publishable files changed
      # since tool/published.yaml's commit has a new version and a matching
      # top CHANGELOG heading, and no package is at a pre-release.
      - name: Versions and CHANGELOG headings
        if: success() || failure()
        working-directory: tool
        run: dart run bin/check_versions.dart

      # Spec 0006 criterion 2: every README install snippet names plain
      # caret constraints that admit the package's own version and the
      # upstream's latest major (tool/upstream_versions.yaml), and says to
      # add the package alongside the upstream. Offline: no pub.dev call.
      - name: README install snippets
        if: success() || failure()
        working-directory: tool
        run: dart run bin/check_readme_snippets.dart

      # Spec 0006 criterion 14: each plugin's ffiSymbols, native definitions
      # and Dart lookups agree, outside tool/symcheck_allow.yaml.
      - name: FFI symbols
        if: success() || failure()
        working-directory: tool
        run: dart run bin/symcheck.dart

      # Spec 0006 criterion 14a: an example that depends on `any` builds
      # against whatever is newest that day, so no example pubspec names
      # `any`, or no constraint, under dependencies or dev_dependencies.
      - name: Example constraints
        if: success() || failure()
        working-directory: tool
        run: dart run bin/check_example_constraints.dart

      # CI logs print every test and group name.
      - name: Test and group names
        if: success() || failure()
        working-directory: tool
        run: dart run bin/check_test_names.dart

  # No `dart format` gate yet. Many files under packages/*/lib and
  # packages/*/test are not formatted today, so a gate would fail on its first
  # run and force a mechanical reformat of published sources as a side effect.
  # The reformat is a change of its own, and the gate follows it.
