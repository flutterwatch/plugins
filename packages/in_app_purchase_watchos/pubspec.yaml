name: in_app_purchase_watchos
description: "watchOS implementation of the in_app_purchase plugin, using dart:ffi over StoreKit to query products and run purchases through SKPaymentQueue."
version: 0.1.1
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins/tree/main/packages/in_app_purchase_watchos
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - in-app-purchase
  - storekit
# Generated by `flutter-watchos plugin port`. See PORTING_REPORT.md.
# License holder: The FlutterWatch Authors

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  in_app_purchase_platform_interface: ^1.4.0
  # Needed by registerWith(): the app-facing package assigns its own
  # implementation over the registrant's on first read of
  # `InAppPurchase.instance`, so we trigger that one-time selection ourselves
  # and install this implementation afterwards. Not a layering violation in
  # practice — `in_app_purchase` does not depend on this package.
  # 3.2.3 is the first version on in_app_purchase_storekit 0.4.x.
  in_app_purchase: ^3.2.3
  # The watchOS platform addition extends StoreKit's, whose sync() exists
  # from 0.4.0.
  in_app_purchase_storekit: ^0.4.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: in_app_purchase
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a
        # static archive force-loaded into the watch binary; Dart
        # resolves the exported symbols via DynamicLibrary.process().
        # Method-channel plugins are not supported on watchOS,
        # so this is the supported plugin model.
        ffiPlugin: true
        dartPluginClass: InAppPurchaseWatchos
        # C symbols exported for dart:ffi lookup. They survive the link
        # because the CLI force-loads the plugin archive, each export is
        # marked used with default visibility, and the CLI keeps global
        # symbols through the App Store strip.
        ffiSymbols:
          - in_app_purchase_watchos_query_start
          - in_app_purchase_watchos_query_ready
          - in_app_purchase_watchos_query_result
          - in_app_purchase_watchos_query_release
          - in_app_purchase_watchos_can_make_payments
          - in_app_purchase_watchos_purchases_start
          - in_app_purchase_watchos_buy
          - in_app_purchase_watchos_purchases_drain
          - in_app_purchase_watchos_finish
          - in_app_purchase_watchos_restore
