name: in_app_purchase_example
description: "watchOS example for in_app_purchase_watchos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # For FlutterWatchosPlatform.isIos, which the watchOS guards in lib/main.dart
  # use.
  flutter_watchos: ^0.1.0
  in_app_purchase: ^3.3.1
  in_app_purchase_watchos:
    path: ../
  in_app_purchase_android: "^0.5.0"
  in_app_purchase_storekit: "^0.4.0"
  shared_preferences: "^2.0.0"
  # consumable_store.dart uses shared_preferences, which needs its watchOS
  # implementation on the watch.
  shared_preferences_watchos: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Test-only: registration_test.dart inspects InAppPurchasePlatform.instance to
  # pin which implementation is live. App code must never import this.
  in_app_purchase_platform_interface: ^1.4.0

flutter:
  uses-material-design: true
