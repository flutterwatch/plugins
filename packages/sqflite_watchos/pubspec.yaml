name: sqflite_watchos
description: "watchOS implementation of the sqflite plugin: SQLite databases on Apple Watch, on the system SQLite via dart:ffi."
version: 0.0.1
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins/tree/main/packages/sqflite_watchos
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - sqlite
  - database
# Generated by `flutter-watchos plugin port`. See PORTING_REPORT.md.
# License holder: The FlutterWatch Authors

environment:
  # Records and switch expressions, which src/ uses, need 3.0; 3.1 matches
  # the other packages here.
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  path: ^1.8.0
  # buildDatabaseFactory and SqfliteDatabaseException come from src/, which
  # sqflite_common_ffi imports the same way. src/ is not public API, so the
  # constraint stops below the next minor. 2.5.14 fixes a hang when a cursor
  # is closed inside a transaction.
  sqflite_common: ">=2.5.14 <2.6.0"
  sqflite_platform_interface: ^2.4.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: sqflite
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a
        # static archive force-loaded into the watch binary, and links
        # the system libsqlite3 that Package.swift names; Dart resolves
        # every symbol via DynamicLibrary.process().
        # Method-channel plugins are not supported on watchOS,
        # so this is the supported plugin model.
        ffiPlugin: true
        dartPluginClass: SqfliteWatchos
        # This package's own C exports. They survive the link because the
        # CLI force-loads the plugin archive, each export is marked used
        # with default visibility, and the CLI keeps global symbols
        # through the App Store strip. SQLite's own functions come from
        # the system libsqlite3.
        ffiSymbols:
          - sqflite_watchos_databases_path
          - sqflite_watchos_sqlite_version
