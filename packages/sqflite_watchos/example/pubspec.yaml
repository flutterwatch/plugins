name: sqflite_example
description: Demonstrates how to use the sqflite plugin and perform some tests.
publish_to: none
version: "0.4.0"

environment:
  sdk: ">=3.1.0 <4.0.0"

# sqflite 2.4.5's own example. Each version is the one it ran with here, as
# a caret, since this repository's CI refuses an unconstrained example
# dependency. Two watch deviations: sqflite_example_common is not on
# pub.dev, so it is pinned to the tekartik/sqflite commit of sqflite 2.4.5,
# and sqflite_watchos is added.
dependencies:
  path: ^1.9.1
  collection: ^1.19.1
  flutter:
    sdk: flutter
  sqflite: ^2.4.5
  sqflite_common: ^2.5.14
  synchronized: ^3.5.0
  matcher: ^0.12.20
  meta: ^1.19.0
  sqflite_example_common:
    git:
      url: https://github.com/tekartik/sqflite
      path: packages_flutter/sqflite_example_common
      ref: 21d2b8d0ab53159a73710db90857d928fad09c84
  sqflite_watchos:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.31.1
  process_run: ^1.4.1
  pub_semver: ^2.2.1
  material_ui: ^1.9.0

flutter:
  uses-material-design: true
