publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.4
  sqflite_watchos:
    path: ../
  path: ^1.9.0

dev_dependencies:
