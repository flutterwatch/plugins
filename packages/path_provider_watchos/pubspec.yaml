name: path_provider_watchos
description: "watchOS implementation of path_provider."
version: 0.0.1
homepage: https://github.com/flutterwatch/plugins
# Generated by `flutter-watchos plugin port`. See PORTING_REPORT.md.
# License holder: The FlutterWatch Authors

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  path_provider_platform_interface: ^2.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: path_provider
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a static
        # archive force-loaded into the watch binary; Dart resolves the
        # exported symbols via DynamicLibrary.process(). This is the plugin
        # model flutter-watchos supports (method-channel plugins are not
        # supported on watchOS).
        ffiPlugin: true
        dartPluginClass: PathProviderWatchos
        # C symbols exported for dart:ffi lookup. The CLI emits a forced
        # reference for each so they survive the static link.
        ffiSymbols:
          - path_provider_watchos_temporary_path
          - path_provider_watchos_application_support_path
          - path_provider_watchos_library_path
          - path_provider_watchos_documents_path
          - path_provider_watchos_cache_path
