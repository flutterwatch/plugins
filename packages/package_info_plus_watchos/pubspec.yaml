name: package_info_plus_watchos
description: "watchOS implementation of the package_info_plus plugin, reading app name, version, build number, and install metadata from NSBundle via dart:ffi."
version: 0.1.0
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - package-info

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  package_info_plus_platform_interface: ^4.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: package_info_plus
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a static
        # archive force-loaded into the watch binary; Dart resolves the
        # exported symbols via DynamicLibrary.process(). Method-channel
        # plugins are not supported on watchOS; FFI is the plugin model.
        ffiPlugin: true
        dartPluginClass: PackageInfoWatchos
        # C symbols exported for dart:ffi lookup; the CLI emits a forced
        # reference for each so they survive the static link.
        ffiSymbols:
          - package_info_plus_watchos_app_name
          - package_info_plus_watchos_package_name
          - package_info_plus_watchos_version
          - package_info_plus_watchos_build_number
          - package_info_plus_watchos_installer_store
          - package_info_plus_watchos_install_time
          - package_info_plus_watchos_update_time
