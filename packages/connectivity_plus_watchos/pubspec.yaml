name: connectivity_plus_watchos
description: "watchOS implementation of the connectivity_plus plugin, reporting network reachability (wifi, cellular, or none) from NWPathMonitor via dart:ffi."
version: 0.2.0
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - connectivity
  - network

environment:
  # 3.1 is where NativeCallable.listener landed — the push path this plugin
  # uses instead of a polling timer.
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  connectivity_plus_platform_interface: ^2.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: connectivity_plus
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a static
        # archive force-loaded into the watch binary; Dart resolves the
        # exported symbol via DynamicLibrary.process(). Method-channel
        # plugins are not supported on watchOS; FFI is the plugin model.
        ffiPlugin: true
        dartPluginClass: ConnectivityPlusWatchos
        ffiSymbols:
          - connectivity_plus_watchos_current
          - connectivity_plus_watchos_set_callback
