name: flutter_local_notifications_watchos
description: "watchOS implementation of the flutter_local_notifications plugin: show, schedule and cancel local notifications on Apple Watch via dart:ffi."
version: 0.0.1
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins/tree/main/packages/flutter_local_notifications_watchos
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - notifications

environment:
  # 3.1 is where NativeCallable.listener landed — the push path this plugin
  # depends on.
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  # IOSFlutterLocalNotificationsPlugin, which this package extends because
  # flutter_local_notifications checks for that type on iOS-reporting
  # platforms, and the Darwin settings and details.
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_local_notifications
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a
        # static archive force-loaded into the watch binary; Dart
        # resolves the exported symbols via DynamicLibrary.process().
        # Method-channel plugins are not supported on watchOS,
        # so this is the supported plugin model.
        ffiPlugin: true
        dartPluginClass: FlutterLocalNotificationsWatchos
        # C symbols exported for dart:ffi lookup. They survive the link
        # because the CLI force-loads the plugin archive, each export is
        # marked used with default visibility, and the CLI keeps global
        # symbols through the App Store strip.
        ffiSymbols:
          - flutter_local_notifications_watchos_set_callback
          - flutter_local_notifications_watchos_initialize
          - flutter_local_notifications_watchos_request_permissions
          - flutter_local_notifications_watchos_check_permissions
          - flutter_local_notifications_watchos_add
          - flutter_local_notifications_watchos_cancel
          - flutter_local_notifications_watchos_cancel_all
          - flutter_local_notifications_watchos_pending
          - flutter_local_notifications_watchos_active
          - flutter_local_notifications_watchos_launch_details
          - flutter_local_notifications_watchos_poll_responses
          - flutter_local_notifications_watchos_take_request_result
          - flutter_local_notifications_watchos_release
