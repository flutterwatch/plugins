name: permission_handler_watchos
description: "watchOS implementation of the permission_handler plugin: location, notifications, sensors, microphone, contacts, calendar, reminders and Bluetooth via dart:ffi."
version: 0.0.1
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins/tree/main/packages/permission_handler_watchos
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - permissions
# Generated by `flutter-watchos plugin port`. See PORTING_REPORT.md.
# License holder: The FlutterWatch Authors

environment:
  # 3.1 is where NativeCallable.listener landed, which the answers come
  # through.
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  permission_handler_platform_interface: ^4.4.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  # test/compile_time_groups_test.dart reads the pubspec's `defines` with
  # the parser the CLI uses.
  yaml: ^3.1.3

flutter:
  plugin:
    implements: permission_handler
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a
        # static archive force-loaded into the watch binary; Dart
        # resolves the exported symbols via DynamicLibrary.process().
        # Method-channel plugins are not supported on watchOS,
        # so this is the supported plugin model.
        ffiPlugin: true
        dartPluginClass: PermissionHandlerWatchos
        # C symbols exported for dart:ffi lookup. They survive the
        # static link because the CLI force-loads the plugin archive
        # and each export is marked used + default-visibility.
        ffiSymbols:
          - permission_handler_watchos_set_callback
          - permission_handler_watchos_check
          - permission_handler_watchos_service
          - permission_handler_watchos_request
          - permission_handler_watchos_take_result
          - permission_handler_watchos_release
        # Each permission group's native code is compiled in only when the
        # app's Info.plist sets one of its keys: from the first
        # flutter-watchos release after 0.1.1, the CLI then defines the
        # group's macro, and an older one compiles every group in. The names
        # are the iOS implementation's PERMISSION_* macros, each keyed to the
        # usage descriptions its prompts check. Notifications, critical
        # alerts and storage need no key and are always compiled in.
        defines:
          PERMISSION_LOCATION_WHENINUSE: NSLocationWhenInUseUsageDescription
          # "Always" too, with the NSUserDefaults flag it keeps.
          PERMISSION_LOCATION:
            - NSLocationAlwaysAndWhenInUseUsageDescription
            - NSLocationAlwaysUsageDescription
          PERMISSION_SENSORS: NSMotionUsageDescription
          PERMISSION_MICROPHONE: NSMicrophoneUsageDescription
          PERMISSION_CONTACTS: NSContactsUsageDescription
          PERMISSION_EVENTS_FULL_ACCESS: NSCalendarsFullAccessUsageDescription
          PERMISSION_EVENTS: NSCalendarsWriteOnlyAccessUsageDescription
          PERMISSION_REMINDERS: NSRemindersFullAccessUsageDescription
          PERMISSION_BLUETOOTH: NSBluetoothAlwaysUsageDescription
          # Siri's opt-in: a Boolean, set to YES only with the Siri
          # capability, since asking about Siri without it ends the app.
          PERMISSION_ASSISTANT: PermissionHandlerWatchosSiri
