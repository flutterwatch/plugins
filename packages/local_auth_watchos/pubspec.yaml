name: local_auth_watchos
description: "watchOS implementation of the local_auth plugin, authenticating the wearer with the device passcode through LocalAuthentication via dart:ffi."
version: 0.1.0
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - authentication
# Generated by `flutter-watchos plugin port`. See PORTING_REPORT.md.
# License holder: The FlutterWatch Authors

environment:
  # 3.1 is where NativeCallable.listener landed — the completion signal this
  # plugin uses instead of a poll loop.
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  local_auth_platform_interface: ^1.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: local_auth
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a
        # static archive force-loaded into the watch binary; Dart
        # resolves the exported symbols via DynamicLibrary.process().
        # Method-channel plugins are not supported on watchOS,
        # so this is the supported plugin model.
        ffiPlugin: true
        dartPluginClass: LocalAuthWatchos
        # C symbols exported for dart:ffi lookup. The CLI emits a
        # forced reference for each so they survive the static link.
        ffiSymbols:
          - local_auth_watchos_is_device_supported
          - local_auth_watchos_supports_biometrics
          - local_auth_watchos_authenticate
          - local_auth_watchos_poll
          - local_auth_watchos_set_callback
          - local_auth_watchos_stop
