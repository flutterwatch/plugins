name: network_info_plus_watchos
description: "watchOS implementation of the network_info_plus plugin, exposing Wi-Fi IPv4 and IPv6 addresses via getifaddrs and dart:ffi (SSID is unavailable on watchOS)."
version: 0.0.1
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - network
# Generated by `flutter-watchos plugin port`. See PORTING_REPORT.md.
# License holder: The FlutterWatch Authors

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  network_info_plus_platform_interface: ^3.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: network_info_plus
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a
        # static archive force-loaded into the watch binary; Dart
        # resolves the exported symbols via DynamicLibrary.process().
        # Method-channel plugins are not supported on watchOS,
        # so this is the supported plugin model.
        ffiPlugin: true
        dartPluginClass: NetworkInfoPlusWatchos
        # C symbols exported for dart:ffi lookup. The CLI emits a
        # forced reference for each so they survive the static link.
        ffiSymbols:
          - network_info_plus_watchos_wifi_ip
          - network_info_plus_watchos_wifi_ipv6
          - network_info_plus_watchos_wifi_submask
          - network_info_plus_watchos_wifi_broadcast
          - network_info_plus_watchos_free
