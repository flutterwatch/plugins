name: network_info_plus_example
description: "watchOS example for network_info_plus_watchos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # For FlutterWatchosPlatform.isIos, which the watchOS guard in lib/main.dart
  # uses.
  flutter_watchos: ^0.1.0
  network_info_plus: ^8.2.1
  network_info_plus_watchos:
    path: ../
  permission_handler: ^12.0.0+1

dev_dependencies:
  network_info_plus_platform_interface: ^3.1.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
