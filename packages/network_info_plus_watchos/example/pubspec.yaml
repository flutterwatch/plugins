name: network_info_plus_example
description: "watchOS example for network_info_plus_watchos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  network_info_plus: ^8.2.1
  network_info_plus_watchos:
    path: ../
  # Upstream's example asks permission_handler for location; this answers it
  # on the watch.
  permission_handler: ^13.0.2
  permission_handler_watchos:
    path: ../../permission_handler_watchos

dev_dependencies:
  network_info_plus_platform_interface: ^3.1.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
