name: geolocator_watchos
description: "watchOS implementation of the geolocator plugin, providing position and permission handling from CoreLocation (CLLocationManager) via dart:ffi."
version: 0.1.0
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - location
  - geolocation
# Generated by `flutter-watchos plugin port`. See PORTING_REPORT.md.
# License holder: The FlutterWatch Authors

environment:
  # 3.1 is where NativeCallable.listener landed — the push path this plugin
  # uses instead of a polling timer.
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  geolocator_platform_interface: ^4.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: geolocator
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a
        # static archive force-loaded into the watch binary; Dart
        # resolves the exported symbols via DynamicLibrary.process().
        # Method-channel plugins are not supported on watchOS,
        # so this is the supported plugin model.
        ffiPlugin: true
        dartPluginClass: GeolocatorWatchos
        # C symbols exported for dart:ffi lookup. The CLI emits a
        # forced reference for each so they survive the static link.
        ffiSymbols:
          - geolocator_watchos_is_service_enabled
          - geolocator_watchos_check_permission
          - geolocator_watchos_request_permission
          - geolocator_watchos_start_updates
          - geolocator_watchos_request_location
          - geolocator_watchos_read_position
          - geolocator_watchos_stop_updates
          - geolocator_watchos_set_callback
