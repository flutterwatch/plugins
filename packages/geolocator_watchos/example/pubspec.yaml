name: geolocator_example
description: "A watchOS example app for geolocator_example."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.1
  geolocator_watchos:
    path: ../
  # Upstream's example is built on the Baseflow template.
  baseflow_plugin_template: ^2.1.2
  # The template's links open with url_launcher; this lets them open on the
  # watch (a listed deviation, see the README).
  url_launcher_watchos: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
