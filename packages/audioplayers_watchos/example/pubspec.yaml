name: audioplayers_example
description: "watchOS example for audioplayers_watchos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  audioplayers: any
  audioplayers_watchos:
    path: ../
  collection: "^1.16.0"
  file_selector: "^1.1.0"
  flutter:
    sdk: flutter
  http: "^1.0.0"
  path_provider: "^2.0.12"
  # watchOS implementation of path_provider — audioplayers' AudioCache
  # writes assets through getTemporaryDirectory().
  path_provider_watchos:
    path: ../../path_provider_watchos
  provider: "^6.0.5"

dev_dependencies:
  audioplayers_platform_interface: "^7.2.0"
  flame_lint: "^1.4.3"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  pub_semver: "^2.2.0"
  pubspec_parse: "^1.5.0"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - pubspec.yaml
