name: audioplayers_watchos
description: "watchOS implementation of audioplayers (dart:ffi)."
version: 0.0.1
homepage: https://github.com/flutterwatch/plugins
# License holder: The FlutterWatch Authors

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  audioplayers_platform_interface: ^7.2.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: audioplayers
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a
        # static archive force-loaded into the watch binary; Dart
        # resolves the exported symbols via DynamicLibrary.process().
        # Method-channel plugins are not supported on watchOS,
        # so this is the supported plugin model.
        ffiPlugin: true
        dartPluginClass: AudioplayersWatchos
        # C symbols exported for dart:ffi lookup. The CLI emits a
        # forced reference for each so they survive the static link.
        ffiSymbols:
          - audioplayers_watchos_create
          - audioplayers_watchos_dispose
          - audioplayers_watchos_set_source_url
          - audioplayers_watchos_set_source_bytes
          - audioplayers_watchos_resume
          - audioplayers_watchos_pause
          - audioplayers_watchos_stop
          - audioplayers_watchos_release
          - audioplayers_watchos_seek
          - audioplayers_watchos_set_volume
          - audioplayers_watchos_set_rate
          - audioplayers_watchos_set_release_mode
          - audioplayers_watchos_read_state
          - audioplayers_watchos_error
          - audioplayers_watchos_set_audio_context
