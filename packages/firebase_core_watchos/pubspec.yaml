name: firebase_core_watchos
description: "watchOS implementation of firebase_core, bridging the Firebase Apple SDK (FirebaseCore) over dart:ffi to configure and read Firebase app instances."
version: 0.0.1-beta.1
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - firebase
# Generated by `flutter-watchos plugin port`, then hand-finished. See PORTING_REPORT.md.
# License holder: The FlutterWatch Authors

# The example app is FlutterFire's upstream example verbatim, including its
# firebase_options.dart. Those identifiers belong to Google's public
# `flutterfire-e2e-tests` demo project, not to a FlutterWatch project, and are
# client-side config rather than secrets.
false_secrets:
  - /example/lib/firebase_options.dart
  - /example/lib/main.dart

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  firebase_core_platform_interface: ^8.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: firebase_core
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a static
        # archive force-loaded into the watch binary, resolves the SwiftPM
        # graph in watchos/Package.swift (which pulls in the Firebase Apple
        # SDK's FirebaseCore product), and Dart resolves the exported symbols
        # via DynamicLibrary.process(). Method-channel plugins are not
        # supported on watchOS; FFI is the plugin model.
        ffiPlugin: true
        dartPluginClass: FirebaseCoreWatchos
        # C symbols exported for dart:ffi lookup. The CLI emits a forced
        # reference for each so they survive the static link.
        ffiSymbols:
          - firebase_core_watchos_configure
          - firebase_core_watchos_options
          - firebase_core_watchos_apps
          - firebase_core_watchos_delete
          - firebase_core_watchos_set_auto_data_collection
          - firebase_core_watchos_free
