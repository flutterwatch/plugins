name: wakelock_plus_watchos
description: "watchOS implementation of the wakelock_plus plugin: a WKExtendedRuntimeSession keeps the app running and in front with the wrist down, via dart:ffi."
version: 0.0.1
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins/tree/main/packages/wakelock_plus_watchos
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - wakelock
# Generated by `flutter-watchos plugin port`. See PORTING_REPORT.md.
# License holder: The FlutterWatch Authors

environment:
  # 3.1 is where NativeCallable.listener landed — the push path this plugin
  # uses to wait for the session to start.
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  wakelock_plus_platform_interface: ^1.7.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: wakelock_plus
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a
        # static archive force-loaded into the watch binary; Dart
        # resolves the exported symbols via DynamicLibrary.process().
        # Method-channel plugins are not supported on watchOS,
        # so this is the supported plugin model.
        ffiPlugin: true
        dartPluginClass: WakelockPlusWatchos
        # C symbols exported for dart:ffi lookup. They survive the link
        # because the CLI force-loads the plugin archive, each export is
        # marked used with default visibility, and the CLI keeps global
        # symbols through the App Store strip.
        ffiSymbols:
          - wakelock_plus_watchos_has_session_mode
          - wakelock_plus_watchos_start
          - wakelock_plus_watchos_stop
          - wakelock_plus_watchos_state
          - wakelock_plus_watchos_last_error
          - wakelock_plus_watchos_set_callback
