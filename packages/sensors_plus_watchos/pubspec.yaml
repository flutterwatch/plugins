name: sensors_plus_watchos
description: "watchOS implementation of the sensors_plus plugin, streaming accelerometer, user-accelerometer, gyroscope, and magnetometer data from CoreMotion via dart:ffi."
version: 0.0.1
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/plugins
issue_tracker: https://github.com/flutterwatch/plugins/issues
topics:
  - watchos
  - ffi
  - sensors
  - coremotion
# Generated by `flutter-watchos plugin port`. See PORTING_REPORT.md.
# License holder: The FlutterWatch Authors

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  sensors_plus_platform_interface: ^2.0.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: sensors_plus
    platforms:
      watchos:
        # FFI plugin: the CLI compiles watchos/Classes/*.m into a
        # static archive force-loaded into the watch binary; Dart
        # resolves the exported symbols via DynamicLibrary.process().
        # Method-channel plugins are not supported on watchOS,
        # so this is the supported plugin model.
        ffiPlugin: true
        dartPluginClass: SensorsPlusWatchos
        # C symbols exported for dart:ffi lookup. The CLI emits a
        # forced reference for each so they survive the static link.
        ffiSymbols:
          - sensors_plus_watchos_start_accelerometer
          - sensors_plus_watchos_read_accelerometer
          - sensors_plus_watchos_stop_accelerometer
          - sensors_plus_watchos_start_user_accelerometer
          - sensors_plus_watchos_read_user_accelerometer
          - sensors_plus_watchos_stop_user_accelerometer
          - sensors_plus_watchos_start_gyroscope
          - sensors_plus_watchos_read_gyroscope
          - sensors_plus_watchos_stop_gyroscope
          - sensors_plus_watchos_start_magnetometer
          - sensors_plus_watchos_read_magnetometer
          - sensors_plus_watchos_stop_magnetometer
