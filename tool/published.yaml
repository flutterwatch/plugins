# published from (spec 0006 criterion 4). tool/bin/check_versions.dart
# compares each package's publishable files with that commit's.
#
# Seeded on 2026-09-30 from the pub.dev API (latest.version, read-only) and
# from the archives themselves: each commit is the newest one whose
# publishable files equal the archive of that version, file by file. For
# nine packages that is 0547b19 or 9ffeab9, not 10591ec, because 10591ec
# changed their analysis_options.yaml after the publish.
#
# The packages published in the 0.1.0 round (the four firebase_*_watchos
# and video_player_watchos) get their rows once that round has published
# them; until then they are checked as unpublished. After each publish, the
# owner records the new version and the commit it was published from.
