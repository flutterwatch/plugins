include: package:lints/recommended.yaml

analyzer:
  # Fixtures are sample repositories that the tests copy and check. They hold
  # their own pubspecs and deliberately broken sources, so they are data here,
  # not code of this package.
  exclude:
    - test/fixtures/**
    - words/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - public_member_api_docs
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
